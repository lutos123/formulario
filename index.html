
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario web</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>
    <script src="script.js"></script>
    <h1>Registro de estudiantes</h1>

    <form action="#" method="post">

        <label for="nombre">Nombre completo:</label>
        <input type="text" id="nombre" name="nombre"
               placeholder="Ingrese su nombre" required>

        <br><br>

        <label for="correo">Correo electrónico:</label>
        <input type="email" id="correo" name="correo"
               placeholder="ejemplo@correo.com" required>

        <br><br>

        <label for="clave">Contraseña:</label>
        <input type="password" id="clave" name="clave"
               required>

        <br><br>

        <label for="fecha">Fecha de nacimiento:</label>
        <input type="date" id="fecha" name="fecha">

        <br><br>

        <p>Género:</p>

        <input type="radio" id="masculino"
               name="genero" value="Masculino">
        <label for="masculino">Masculino</label>

        <input type="radio" id="femenino"
               name="genero" value="Femenino">
        <label for="femenino">Femenino</label>

        <br><br>

        <label for="carrera">Especialidad:</label>
        <select id="carrera" name="carrera">
            <option value="">Seleccione una carrera</option>
            <option value="software">Ingeniería de Software</option>
            <option value="diseno">Diseño Gráfico Digital</option>
            <option value="mecanica">Mecánica Automotriz</option>
        </select>

        <br><br>

        <label for="comentario">Comentario:</label>
        <br>
        <textarea id="comentario" name="comentario"
                  rows="4" cols="35"></textarea>

        <br><br>

        <input type="checkbox" id="acepto"
               name="acepto" required>
        <label for="acepto">Acepto las condiciones</label>

        <br><br>

        <button type="submit">Enviar</button>
        <button type="reset">Limpiar</button>

    </form>

</body>
</html>
